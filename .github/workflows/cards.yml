name: Generate profile cards

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats card
        run: |
          mkdir -p profile
          curl -fsSL -o profile/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=github-dark&hide_border=true&bg_color=0D1117&title_color=39FF14&icon_color=39FF14&text_color=C9D1D9"

      - name: Fetch top languages card
        run: |
          curl -fsSL -o profile/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=github-dark&hide_border=true&bg_color=0D1117&title_color=39FF14&text_color=C9D1D9"

      - name: Fetch trophy card
        run: |
          curl -fsSL -o profile/trophy.svg \
            "https://github-profile-trophy.vercel.app/?username=${{ github.repository_owner }}&theme=onedark&column=-1&margin-w=8&margin-h=8&no-frame=true"

      - name: Commit cards
        run: |
          if git diff --quiet -- profile; then
            echo "No card changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git commit -m "chore: update profile cards"
          git push
