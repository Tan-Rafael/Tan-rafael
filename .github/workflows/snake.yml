name: Generate contribution snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#22D3EE,#38BDF8,#7C3AED&color_dots=#0B1220,#0E4F63,#0891B2,#22D3EE,#A855F7&color_dots_border=#05070D
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22D3EE,#38BDF8,#7C3AED&color_dots=#05070D,#0E4F63,#0891B2,#22D3EE,#A855F7&color_dots_border=#020208

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
