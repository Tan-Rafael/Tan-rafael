<svg viewBox="0 0 1200 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated cyber scanline divider">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="56" fill="url(#grid)"/>

  <g>
    <line x1="0" y1="10" x2="1200" y2="10" stroke="#1F6F2C" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="0" y1="46" x2="1200" y2="46" stroke="#1F6F2C" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <rect x="-300" y="0" width="300" height="56" fill="url(#fade)" filter="url(#glow)">
    <animate attributeName="x" values="-300;1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <line x1="0" y1="28" x2="1200" y2="28" stroke="#39FF14" stroke-width="1" stroke-opacity="0.25"/>

  <g fill="#39FF14" filter="url(#glow)">
    <circle cx="600" cy="28" r="2.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="28" r="1.6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="28" r="1.6">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
